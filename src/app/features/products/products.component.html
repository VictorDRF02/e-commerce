<div class="container mx-auto px-4 py-8">
  <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h2 class="text-lg font-semibold text-gray-800">Filtrar por categoría</h2>
      <p class="text-sm text-gray-500">Elige una categoría para acotar la lista de productos.</p>
    </div>

    <label class="flex flex-col gap-1 text-sm font-medium text-gray-700">
      <span>Categoría</span>
      <select
        [value]="selectedCategory()"
        (change)="onCategoryChange($event)"
        class="min-w-56 rounded-lg border border-gray-300 bg-white px-4 py-2 text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
      >
        <option value="all">Todas las categorías</option>
        @for (category of categories(); track category) {
        <option [value]="category">{{ category }}</option>
        }
      </select>
    </label>
  </div>

  <!-- Products -->
  <div class="grid sm:grid-cols-1 lg:grid-cols-3 gap-6">
    @if (isLoading()) { @for (item of [1, 2, 3]; track $index) {
    <app-product-placeholder></app-product-placeholder>
    } } @else { @for (product of filteredProducts(); track $index) {
    <app-product-card [product]="product"></app-product-card>
    } }
  </div>
  @if (!isLoading() && filteredProducts().length == 0) {
  <app-no-products-found></app-no-products-found>
  }
</div>
