<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/60 backdrop-blur-sm"
>
  <div
    class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden transform transition-all"
  >
    <div class="p-6">
      <div
        class="flex items-center justify-center w-12 h-12 mx-auto bg-red-100 rounded-full"
      >
        <svg
          class="w-6 h-6 text-red-600"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 15.667c-.77 1.333.192 3 1.732 3z"
          />
        </svg>
      </div>

      <div class="mt-4 text-center">
        <h3 class="text-xl font-bold text-gray-900">¿Eliminar producto?</h3>
        <p class="mt-2 text-sm text-gray-500">
          Esta acción no se puede deshacer. El producto
          <span class="font-semibold text-gray-800"
            >"{{ product?.title }}"</span
          >
          será borrado permanentemente de la base de datos.
        </p>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 p-6 bg-gray-50">
      <button
        type="button"
        (click)="closeModal()"
        class="flex-1 px-4 py-3 text-sm font-semibold text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-100 transition-colors"
      >
        No, mantenerlo
      </button>

      <button
        type="button"
        (click)="remove()"
        class="flex-1 px-4 py-3 text-sm font-semibold text-white bg-red-600 rounded-xl hover:bg-red-700 shadow-lg shadow-red-200 active:scale-95 transition-all"
      >
        Sí, eliminar
      </button>
    </div>
  </div>
</div>
