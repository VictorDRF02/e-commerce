<div class="container mx-auto px-4 py-8 max-w-6xl">
  <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100" [formGroup]="form">
    <div class="md:flex">
      
      <div class="md:w-5/12 p-8 bg-gray-50 flex flex-col items-center justify-center border-r border-gray-100">
        <div class="relative group w-full flex flex-col items-center">
          <img
            [src]="imagePreview"
            [alt]="product?.title"
            class="max-h-80 object-contain drop-shadow-md group-hover:opacity-75 transition-opacity"
            loading="lazy"
          />
          
          <div class="mt-6 w-full">
            <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-white hover:bg-gray-50 transition-colors">
              <div class="flex flex-col items-center justify-center pt-5 pb-6">
                <svg class="w-8 h-8 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                <p class="mb-2 text-sm text-gray-500 font-semibold">Haz clic para subir imagen</p>
                <p class="text-xs text-gray-400">PNG, JPG, WEBP, SVG</p>
                @if (selectedImageName) {
                <p class="mt-1 text-xs text-blue-600">{{ selectedImageName }}</p>
                }
                @if (isUploadingImage) {
                <p class="mt-1 text-xs text-gray-500">Subiendo imagen...</p>
                }
              </div>
              <input
                type="file"
                class="hidden"
                accept="image/png,image/jpeg,image/webp,image/svg+xml,image/gif"
                (change)="onImageSelected($event)"
              />
            </label>
          </div>
        </div>
      </div>

      <div class="md:w-7/12 p-8 lg:p-12">
        <div class="space-y-6">
          
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-blue-600 mb-1">Categoría</label>
            <input 
              type="text" 
              formControlName="category" 
              list="category-suggestions"
              placeholder="Ej. Electrónica"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
            />
            <datalist id="category-suggestions">
              @for (category of categorySuggestions; track category) {
              <option [value]="category"></option>
              }
            </datalist>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre del Producto</label>
            <input 
              type="text" 
              formControlName="title" 
              placeholder="Nombre del producto"
              class="w-full px-4 py-3 text-lg font-medium border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
            />
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Precio (USD)</label>
            <div class="relative">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">$</span>
              <input 
                type="number" 
                formControlName="price" 
                class="w-full pl-8 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
              />
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Descripción</label>
            <textarea 
              rows="4"
              formControlName="description" 
              placeholder="Describe los detalles del producto..."
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all resize-none"
            ></textarea>
          </div>

          <div class="flex flex-col sm:flex-row gap-4 pt-4">
            <button
              class="flex-1 px-8 py-4 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 hover:shadow-blue-200 transition-all active:scale-95"
              [disabled]="form.invalid || isUploadingImage"
              (click)="save()"
            >
              Guardar Cambios
            </button>
            <button
              type="button"
              (click)="close.emit()"
              class="flex-1 px-8 py-4 border-2 border-gray-200 text-gray-600 font-bold rounded-xl hover:bg-gray-50 transition-all"
            >
              Cancelar
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
